name: CI

on:
  push:
    branches:
      - release
      - development
    tags:
      - "v*"
  pull_request:
    branches:
      - release
      - development

permissions:
  contents: write
  deployments: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - run: go version
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  verify-tag-on-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag commit is on release branch
        run: |
          git fetch origin release --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/release"

  deploy-beta:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta')
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    environment:
      name: go-beta

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - run: go test ./...
      - run: go build ./...
      - run: tar -czf tcknvkn-go-${{ github.ref_name }}.tar.gz *.go go.mod README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: tcknvkn-go-${{ github.ref_name }}
          path: tcknvkn-go-${{ github.ref_name }}.tar.gz

      - name: Create beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: false
          body: |
            Go için TCKN (TC Kimlik No) ve VKN (Vergi Kimlik No) doğrulama kütüphanesi beta sürümü.

            İlgili bağlantılar:
            - https://www.tcknvkn.com/kutuphaneler
            - https://www.tcknvkn.com/kutuphaneler/go
            - https://www.tcknvkn.com/tc-uret
            - https://www.tcknvkn.com/tc-no-uret
            - https://www.tcknvkn.com/tc-uretici
            - https://tcknvkn.com/tckn-uret
            - https://www.tcknvkn.com/vergi-no-uret
            - https://www.tcknvkn.com/vergi-no-uretici
            - https://tcknvkn.com/vkn-uret

            #tckn #vkn #go #golang #tcknvkn #tcuret #vknuret

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-beta')
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    environment:
      name: go-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - run: go test ./...
      - run: go build ./...
      - run: tar -czf tcknvkn-go-${{ github.ref_name }}.tar.gz *.go go.mod README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: tcknvkn-go-${{ github.ref_name }}
          path: tcknvkn-go-${{ github.ref_name }}.tar.gz

      - name: Create production release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: false
          body: |
            Go için TCKN (TC Kimlik No) ve VKN (Vergi Kimlik No) doğrulama kütüphanesi kararlı sürümü.

            İlgili bağlantılar:
            - https://www.tcknvkn.com/kutuphaneler
            - https://www.tcknvkn.com/kutuphaneler/nodejs
            - https://www.tcknvkn.com/tc-uret
            - https://www.tcknvkn.com/tc-no-uret
            - https://www.tcknvkn.com/tc-uretici
            - https://tcknvkn.com/tckn-uret
            - https://www.tcknvkn.com/vergi-no-uret
            - https://www.tcknvkn.com/vergi-no-uretici
            - https://tcknvkn.com/vkn-uret

            #tckn #vkn #go #golang #tcknvkn #tcuret #vknuret
